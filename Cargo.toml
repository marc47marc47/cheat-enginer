[package]
name = "cheat-enginer"
version = "0.3.1"
edition = "2024"

# `rlib` for the TUI binary and the tests, `cdylib` so the Android build gets a
# `libcheat_enginer.so` for `System.loadLibrary`.
[lib]
name = "ce_engine"
crate-type = ["rlib", "cdylib"]

# The TUI binary is skipped entirely under `--no-default-features`, which is how
# the Android build avoids compiling ratatui/crossterm at all.
[[bin]]
name = "cheat-enginer"
path = "src/main.rs"
required-features = ["tui"]

[features]
default = ["tui"]
tui = ["dep:ratatui", "dep:crossterm", "dep:unicode-width"]
android = []

[dependencies]
ratatui = { version = "0.29", optional = true }
crossterm = { version = "0.28", optional = true }
unicode-width = { version = "0.2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.10"
anyhow = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_System_Diagnostics_Debug",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
