org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# The overlay is deliberately AndroidX-free: it is dropped into arbitrary debug
# APKs, and every runtime dependency it carries is a version it could force on
# a host app. Framework views only.
android.useAndroidX=false
android.nonTransitiveRClass=true
